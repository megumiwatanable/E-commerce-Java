services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: ecommerce-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - ecommerce-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: ecommerce-kafka
    depends_on:
      zookeeper:
        condition: service_started
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - ecommerce-network

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: ecommerce-user-service
    ports:
      - "8081:8081"
    environment:
      MYSQL_HOST: ${MYSQL_HOST:-workspace-mysql-1}
      MYSQL_USERNAME: ${MYSQL_USERNAME:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-secure-random-string}
    networks:
      - ecommerce-network
      - workspace-app-network

  product-service:
    build:
      context: .
      dockerfile: product-service/Dockerfile
    container_name: ecommerce-product-service
    ports:
      - "8082:8082"
    environment:
      MYSQL_HOST: ${MYSQL_HOST:-workspace-mysql-1}
      MYSQL_USERNAME: ${MYSQL_USERNAME:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
    networks:
      - ecommerce-network
      - workspace-app-network

  inventory-service:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    container_name: ecommerce-inventory-service
    ports:
      - "8083:8083"
    environment:
      MYSQL_HOST: ${MYSQL_HOST:-workspace-mysql-1}
      MYSQL_USERNAME: ${MYSQL_USERNAME:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_started
    networks:
      - ecommerce-network
      - workspace-app-network

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: ecommerce-order-service
    ports:
      - "8084:8084"
    environment:
      MYSQL_HOST: ${MYSQL_HOST:-workspace-mysql-1}
      MYSQL_USERNAME: ${MYSQL_USERNAME:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PRODUCT_SERVICE_URL: http://product-service:8082
      INVENTORY_SERVICE_URL: http://inventory-service:8083
      PAYMENT_SERVICE_URL: http://payment-service:8085
    depends_on:
      kafka:
        condition: service_started
    networks:
      - ecommerce-network
      - workspace-app-network

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    container_name: ecommerce-payment-service
    ports:
      - "8085:8085"
    environment:
      MYSQL_HOST: ${MYSQL_HOST:-workspace-mysql-1}
      MYSQL_USERNAME: ${MYSQL_USERNAME:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_started
    networks:
      - ecommerce-network
      - workspace-app-network

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: ecommerce-notification-service
    ports:
      - "8086:8086"
    environment:
      MYSQL_HOST: ${MYSQL_HOST:-workspace-mysql-1}
      MYSQL_USERNAME: ${MYSQL_USERNAME:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_started
    networks:
      - ecommerce-network
      - workspace-app-network

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: ecommerce-api-gateway
    ports:
      - "8090:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-secure-random-string}
    depends_on:
      - user-service
      - product-service
      - inventory-service
      - order-service
      - payment-service
      - notification-service
    networks:
      - ecommerce-network

networks:
  ecommerce-network:
    driver: bridge
  workspace-app-network:
    external: true
    name: workspace_app_net
